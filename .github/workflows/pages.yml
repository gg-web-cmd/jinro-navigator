# 깃허브 페이지스 배포 — main 에 push 하면 public/ 폴더를 그대로 공개 주소로 올린다.
# 주소: https://gg-web-cmd.github.io/jinro-navigator/
# 페이지스는 정적 파일만 올릴 수 있어 server.js 는 돌지 않는다.
# 그래서 이 주소에서는 AI(Upstage) 대신 브라우저 안의 기본 분석 엔진이 보고서를 만든다.
# (AI 보고서까지 쓰려면 DEPLOY.md 의 Render 배포를 따로 쓴다.)

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
