<!-- 앱의 HTML 셸. 헤더/본문 컨테이너/푸터/토스트 자리만 두고, 화면은 전부 /js/app.js 가 렌더합니다. -->

<!doctype html>
<html lang="ko">
<head>

<body>
  <a class="skip-link no-print" href="#app">본문으로 바로가기</a>

  <header class="app-header no-print">
    <div class="wrap app-header__inner">
      <a class="brand" href="#/" aria-label="진로 잠재력 내비게이터 홈으로">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="28" height="28" focusable="false">
            <path d="M32 11l5.4 13.9L52 30l-14.6 5.1L32 49l-5.4-13.9L12 30l14.6-5.1z" fill="currentColor" />

        <span class="badge" id="level-badge" hidden></span>

        <span class="badge" id="progress-badge" hidden></span>

  <main id="app" class="wrap" tabindex="-1">
    <div class="screen">
      <div class="card card--pad center stack" id="boot">

        <p class="muted">화면을 준비하고 있어요. 잠시만 기다려 주세요…</p>

  </main>

  <footer class="app-footer no-print">
    <div class="wrap stack">

      <p class="small muted">

      </div>
    </div>

  <script type="module" src="/js/app.js"></script>
